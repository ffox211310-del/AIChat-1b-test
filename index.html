        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap');
        *{box-sizing:border-box}
        html,body{margin:0;height:100%;background:#fafaf8}
        .root{
          min-height:100vh;
          display:flex;
          flex-direction:column;
          font-family:"Inter","Zen Kaku Gothic New",system-ui,-apple-system,sans-serif;
          color:#1c1c1f;
          background: radial-gradient(1200px 600px at 20% -10%, #e8e6ff 0%, transparent 60%),
                      radial-gradient(1000px 500px at 100% 0%, #ffefe6 0%, transparent 50%),
                      #fafaf8;
        }
        header{
          position:sticky;top:0;z-index:10;
          backdrop-filter: blur(16px);
          background: rgba(250,250,248,0.8);
          border-bottom:1px solid #eceae6;
          padding:14px 18px;
          display:flex;align-items:center;justify-content:space-between;gap:12px;
        }
        .brand{display:flex;align-items:center;gap:10px}
        .dot{width:28px;height:28px;border-radius:9px;background:#111;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;letter-spacing:-0.02em}
        .model-name{font-weight:600;font-size:14px;letter-spacing:-0.01em}
        .model-sub{font-size:11px;color:#8a8884;margin-top:1px}
        .status-chip{
          font-size:11px;padding:6px 10px;border-radius:999px;
          border:1px solid #e8e2d9;background:#fff;
          display:flex;align-items:center;gap:6px;white-space:nowrap;
        }
        .status-dot{width:6px;height:6px;border-radius:50%;background:#c5c3be}
        .status-dot.ready{background:#16a34a;box-shadow:0 0 0 4px rgba(22,163,74,0.12)}
        .status-dot.loading{background:#f59e0b;animation:pulse 1.2s infinite}
        .status-dot.error{background:#ef4444}
        @keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
        .progress-wrap{
          height:2px;background:transparent;overflow:hidden;
        }
        .progress-bar{
          height:100%;background:#111;transition:width .2s ease;
          border-radius:0 2px 2px 0;
        }
        main{
          flex:1;
          max-width:760px;width:100%;margin:0 auto;
          display:flex;flex-direction:column;
          padding:0 14px 0;
        }
        .log{
          flex:1;
          overflow:auto;
          padding:28px 4px 20px;
          display:flex;flex-direction:column;gap:14px;
          scrollbar-width:thin;
        }
        .bubble-row{display:flex;gap:10px;max-width:88%}
        .bubble-row.user{align-self:flex-end;flex-direction:row-reverse}
        .bubble-row.assistant{align-self:flex-start}
        .avatar{width:28px;height:28px;border-radius:50%;flex:0 0 28px;display:grid;place-items:center;font-size:12px;font-weight:600}
        .avatar.user{background:#111;color:#fff}
        .avatar.assistant{background:#fff;border:1px solid #e9e5de;color:#5c5a57}
        .bubble{
          padding:11px 14px;border-radius:18px;
          font-size:14.5px;line-height:1.6;letter-spacing:-0.01em;
          word-break:break-word;white-space:pre-wrap;
          box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .bubble.user{background:#111;color:#fff;border-bottom-right-radius:6px}
        .bubble.assistant{background:#fff;border:1px solid #ece8e1;color:#1f1e1d;border-bottom-left-radius:6px}
        .bubble.empty{opacity:.6}
        .composer-wrap{
          position:sticky;bottom:0;
          background: linear-gradient(to top, #fafaf8 70%, rgba(250,250,248,0));
          padding:14px 0 18px;
        }
        .composer{
          display:flex;align-items:center;gap:8px;
          background:#fff;border:1px solid #e8e3dc;border-radius:999px;
          padding:6px 6px 6px 16px;
          box-shadow: 0 8px 24px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
        }
        .composer:focus-within{border-color:#111}
        .composer input{
          flex:1;border:0;outline:0;background:transparent;
          font-size:15px;font-family:inherit;color:#111;
        }
        .composer input::placeholder{color:#a8a5a0}
        .send-btn{
